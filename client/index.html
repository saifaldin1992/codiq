<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale` and no `user-scalable=no`: capping the zoom is a
         direct WCAG 1.4.4 (Resize Text) failure, and Arabic body copy at 13px is
         exactly the text a low-vision visitor needs to pinch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- `/` is the PUBLIC marketing page, not the owner console. The old title
         («لوحة مالك المنصة») was what search results, browser tabs and every
         shared link showed. Nothing calls `document.title`, so this tag is the
         whole of the page's identity. -->
    <title>Codiq — منصة المتاجر الإلكترونية في العراق</title>
    <meta
      name="description"
      content="أطلق متجرك الإلكتروني في العراق خلال دقائق: أسعار توصيل لكل محافظة، متاجر متعددة بحساب واحد، فريق بصلاحيات دقيقة، وسجل مالي شفاف — بواجهة عربية كاملة." />
    <link rel="canonical" href="https://codiqos.com/" />
    <meta name="theme-color" content="#1E6FDB" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codiq" />
    <meta property="og:locale" content="ar_IQ" />
    <meta property="og:url" content="https://codiqos.com/" />
    <meta
      property="og:title"
      content="Codiq — منصة المتاجر الإلكترونية في العراق" />
    <meta
      property="og:description"
      content="أطلق متجرك الإلكتروني خلال دقائق: أسعار توصيل لكل محافظة، متاجر متعددة بحساب واحد، وسجل مالي شفاف — بلا بطاقة ائتمان." />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Codiq — منصة المتاجر الإلكترونية في العراق" />
    <meta
      name="twitter:description"
      content="أطلق متجرك الإلكتروني خلال دقائق: أسعار توصيل لكل محافظة، متاجر متعددة بحساب واحد، وسجل مالي شفاف — بلا بطاقة ائتمان." />

    <!-- Inline SVG favicon: the ق-138 circular mark in its SMALL-SIZE form —
         thicker stroke (13) and NO coin, because at 16px the coin smears into
         noise (docs/brand/CODIQ_LOGO_GUIDELINES.pdf, «الأحجام»). Same mark as
         <BrandMark />, no extra request and no raster asset (vector-only rule). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Ccircle cx='48' cy='48' r='48' fill='%231E6FDB'/%3E%3Cpath d='M64.5 31.2a22.6 22.6 0 1 0 0 33.6' fill='none' stroke='%23fff' stroke-width='13' stroke-linecap='round'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Owner decision (2026-08-27): Rubik carries Arabic across the whole
         platform, with Inter as the Latin companion. Both families are declared
         once in index.css as --font-sans; nothing should name a family again. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
