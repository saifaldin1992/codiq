name: backup

# Encrypted logical backup of the production database to a SEPARATE bucket
# (Cloudflare R2 recommended). Complements Supabase's own daily backups: this
# copy survives losing the Supabase project itself. See docs/DISASTER_RECOVERY.md.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: backup / production
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Must be >= the server's major version; pg_dump refuses a newer server.
      PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install pg_dump ${{ env.PG_MAJOR }} (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Dump, encrypt, upload
        env:
          CODIQ_POSTGRES_URL_UNPOOLED: ${{ secrets.SUPABASE_DB_URL_DIRECT }}
          CODIQ_BACKUP_ENCRYPTION_KEY: ${{ secrets.CODIQ_BACKUP_ENCRYPTION_KEY }}
          CODIQ_BACKUP_S3_ENDPOINT: ${{ secrets.CODIQ_BACKUP_S3_ENDPOINT }}
          CODIQ_BACKUP_S3_REGION: auto
          CODIQ_BACKUP_S3_BUCKET: ${{ secrets.CODIQ_BACKUP_S3_BUCKET }}
          CODIQ_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.CODIQ_BACKUP_S3_ACCESS_KEY_ID }}
          CODIQ_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.CODIQ_BACKUP_S3_SECRET_ACCESS_KEY }}
          CODIQ_BACKUP_S3_FORCE_PATH_STYLE: "true"
        run: pnpm backup:run
