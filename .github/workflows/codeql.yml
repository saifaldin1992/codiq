name: codeql

# Static security analysis (SAST) of the TypeScript/JavaScript code with
# GitHub CodeQL's `security-extended` query suite. Findings appear in the
# repository's Security tab → Code scanning, and on pull requests.
on:
  pull_request:
  push:
    branches: [main, release]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql / javascript-typescript
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - docs
              - "**/*.md"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
